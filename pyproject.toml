[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Ban ca nhan: chi cai core CPU torch-free. Khong dung GPU/dev group.
default-groups = []

[project]
name = "vieneu"
version = "3.6.4"
description = "Ban ca nhan gon nhe cua VieNeu-TTS v3 Turbo: TTS preset-voice offline, CPU ONNX, server local 1 nguoi"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Operating System :: OS Independent",
]
keywords = [
    "text-to-speech",
    "tts",
    "vietnamese",
    "offline",
    "personal-use",
    "on-device",
    "onnx",
    "cpu",
]
authors = [
    { name = "Pham Nguyen Ngoc Bao (upstream VieNeu-TTS)" },
    { name = "Dao Manh Dung (minimal personal-use fork)", email = "interface.daodung@gmail.com" },
]
requires-python = ">=3.10"
# Core toi thieu cho server local apps/web_stream.py (CPU, torch-free, khong clone/GUI/Docker/GPU).
# Da cat so voi upstream https://github.com/pnnbao97/VieNeu-TTS (Apache-2.0) — xem NOTICE:
# gradio, librosa, torch/torchaudio, transformers, neucodec,
# lmdeploy, soxr, kaldi-native-fbank, PyYAML, soundfile.
dependencies = [
    "sea-g2p>=0.9.1", # phonemizer (Rust, torch-free)
    "onnxruntime>=1.20.0", # chay backbone v3 Turbo + MOSS codec tren CPU
    "numpy",
    "tokenizers>=0.20", # phoneme tokenizer
    "huggingface_hub", # tai model lan dau neu thieu model/ local
    "python-dotenv", # doc .env (VIENEU_PRECISION, VIENEU_ONNX_DIR, VIENEU_CODEC_DIR)
    "fastapi", # server local 127.0.0.1:8001
    "uvicorn", # ASGI server cho /stream
    "pydantic>=2.0", # model StreamReq cho POST /stream
]

[project.urls]
"Homepage" = "https://github.com/interface-daodung/VieNeu-TTS"
"Repository" = "https://github.com/interface-daodung/VieNeu-TTS"
"Bug Tracker" = "https://github.com/interface-daodung/VieNeu-TTS/issues"
"Upstream" = "https://github.com/pnnbao97/VieNeu-TTS"

[project.scripts]
vieneu-stream = "apps.web_stream:main"

[tool.setuptools]
package-dir = {"" = "src", "apps" = "apps"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["vieneu*", "vieneu_utils*", "apps*"]

[tool.setuptools.package-data]
vieneu = ["assets/*.json"]
